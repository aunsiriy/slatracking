<!DOCTYPE html>
<html lang="th" data-brand="pea" data-theme="light">
<head>
<meta charset="UTF-8">
<title>PEA-SLA Tracking — P2 กระบวนการแก้กระแสไฟฟ้าขัดข้อง</title>
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/primitive.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-light.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-dark.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-high-contrast.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/tokens.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/typography.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/pea-ds-react.bundle.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/styles.css">
<link rel="stylesheet" href="/icons.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--pea-bg-secondary);color:var(--pea-text-primary);font-family:"Google Sans",sans-serif;-webkit-font-smoothing:antialiased}
h1{font-family:"IBM Plex Sans Thai",sans-serif;margin:0}
a{color:var(--pea-text-brand-secondary);text-decoration:none}
a:hover{color:var(--pea-text-brand-secondary-hover)}
button{font-family:inherit}
.icon{display:inline-block;flex-shrink:0}
.shell{display:flex;min-height:100vh}
.card{background:#fff;border:1px solid var(--pea-border-secondary);border-radius:12px}

/* sidebar */
.tsb{width:280px;flex-shrink:0;background:#fff;border-right:1px solid var(--pea-border-secondary);display:flex;flex-direction:column;padding:20px 0}
.tsb-brand{display:flex;align-items:center;gap:10px;padding:0 20px 20px}
.tsb-logo{width:36px;height:36px}
.tsb-brand-text{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:16px}
.tsb-nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.tsb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--pea-text-secondary);border:none;background:none;width:100%;text-align:left;cursor:pointer}
.tsb-item:hover{background:var(--pea-bg-secondary-hover)}
.tsb-item-chevron{margin-left:auto;color:var(--pea-border-primary)}
.tsb-sub{display:flex;flex-direction:column;gap:1px;padding-left:14px;margin-top:2px}
.tsb-sub-item{display:block;padding:9px 12px;border-radius:8px;font-size:13px;color:var(--pea-text-tertiary);line-height:1.4}
.tsb-sub-item:hover{background:var(--pea-bg-secondary-hover);color:var(--pea-text-primary)}
.tsb-sub-item.is-active{background:var(--pea-bg-brand-primary);color:var(--pea-text-brand-primary);font-weight:600}
.tsb-footer{padding:12px 12px 0;border-top:1px solid var(--pea-border-tertiary);display:flex;flex-direction:column;gap:2px}

/* topbar */
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.ttb{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--pea-border-secondary);background:#fff}
.ttb-right{display:flex;align-items:center;gap:12px}
.icon-btn-wrap{position:relative}
.ttb-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--pea-bg-error-solid);border:1.5px solid #fff}

/* content */
.content{padding:28px 32px 60px;max-width:1400px;width:100%;margin:0 auto}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pea-text-tertiary);margin-bottom:14px}
.breadcrumb .is-current{color:var(--pea-text-brand-secondary);font-weight:600}
.page-title{font-size:28px;font-weight:700;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--pea-border-tertiary)}

/* kpi */
.tkpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.tkpi-card{border-radius:12px;border:1px solid;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.tkpi-label{font-size:14px;font-weight:600;color:var(--pea-text-secondary)}
.tkpi-value{font-family:"IBM Plex Sans Thai";font-size:32px;font-weight:700}

/* search */
.search-card{padding:18px 20px;margin-bottom:14px}
.search-row{display:flex;gap:10px;align-items:flex-end}
.search-input-wrap{flex:1}
.search-actions{display:flex;gap:10px}
.filter-count{background:var(--pea-bg-brand-primary);color:var(--pea-text-brand-primary);border-radius:9999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:4px}

/* filter row */
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filter-row-label{font-size:13px;color:var(--pea-text-tertiary);font-weight:600}
.filter-chip{display:flex;align-items:center;gap:6px;background:var(--pea-bg-secondary);border:1px solid var(--pea-border-secondary);border-radius:9999px;padding:6px 12px;font-size:12.5px;color:var(--pea-text-secondary);font-weight:500}
.filter-spacer{flex:1}

/* tabs */
.table-card{overflow:hidden}
.tabs-row{display:flex;border-bottom:1px solid var(--pea-border-tertiary);padding:0 20px}
.tab-btn{border:none;padding:16px 4px !important;margin-right:28px;font-size:14px !important;font-weight:600 !important;color:var(--pea-text-tertiary);display:flex;align-items:center;gap:8px;cursor:pointer;border-radius:0 !important;border-bottom:2px solid transparent}
.tab-btn.is-active{color:var(--pea-text-brand-secondary) !important;border-bottom-color:var(--pea-border-brand-alt)}
.tab-count{background:var(--pea-bg-tertiary);color:var(--pea-text-tertiary);border-radius:9999px;font-size:11px;font-weight:700;padding:1px 8px}
.tab-btn.is-active .tab-count{background:var(--pea-bg-brand-primary);color:var(--pea-text-brand-primary)}

/* table */
.table-scroll{overflow-x:auto}
.data-table{width:100%;border-collapse:collapse}
.data-table th{text-align:left;font-size:12.5px;font-weight:700;color:var(--pea-text-tertiary);text-transform:uppercase;letter-spacing:.02em;padding:12px 20px;background:var(--pea-bg-secondary-subtle);white-space:nowrap}
.th-sort{margin-left:4px;vertical-align:middle;color:var(--pea-border-primary)}
.data-table td{padding:14px 20px;font-size:13.5px;color:var(--pea-text-secondary);border-top:1px solid var(--pea-border-tertiary);white-space:nowrap}
.case-link{font-weight:600}
.sla-pill{display:inline-block;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600;white-space:nowrap}

/* pagination */
.pagination-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-top:1px solid var(--pea-border-tertiary)}
.pagination-info{font-size:13px;color:var(--pea-text-tertiary)}
.pagination-info select{margin-left:6px;border:1px solid var(--pea-border-secondary);border-radius:6px;padding:4px 6px;font-size:13px}
.pagination-controls{display:flex;gap:4px}
.page-btn{width:32px !important;height:32px !important;padding:0 !important;border-radius:9999px !important;font-size:13px !important;font-weight:600 !important;color:var(--pea-text-tertiary)}
.page-btn.is-active{background:var(--pea-bg-brand-solid) !important;color:#fff !important}
.tsb-group-head{width:100%;justify-content:flex-start !important;text-align:left}

@media (max-width:1180px){
  .tsb{display:none}
  .tkpi-grid{grid-template-columns:1fr}
  .search-row{flex-wrap:wrap}
}
</style>
</head>
<body>

</html>
