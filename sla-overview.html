<!DOCTYPE html>
<html lang="th" data-brand="pea" data-theme="light">
<head>
<meta charset="UTF-8">
<title>ภาพรวมการรายงานผล SLA — PEA-SLA Tracking System</title>
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/primitive.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-light.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-dark.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-high-contrast.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/tokens.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/typography.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/pea-ds-react.bundle.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/styles.css">
<link rel="stylesheet" href="/icons.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--pea-bg-secondary);color:var(--pea-text-primary);font-family:var(--pea-font-family-body,"Google Sans",sans-serif);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--pea-font-family-display,"IBM Plex Sans Thai",sans-serif);margin:0}
a{color:var(--pea-text-brand-secondary);text-decoration:none}
a:hover{color:var(--pea-text-brand-secondary-hover)}
button{font-family:inherit}
.icon{display:inline-block;flex-shrink:0}
.card{background:#fff;border:1px solid var(--pea-border-secondary);border-radius:12px}

.otop{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 24px;background:#fff;border-bottom:1px solid var(--pea-border-secondary)}
.otop-left{display:flex;align-items:center;gap:10px}
.otop-logo{width:36px;height:36px;border-radius:8px;object-fit:contain}
.otop-word{display:flex;flex-direction:column;line-height:1.2}
.otop-title{font-family:var(--pea-font-family-display);font-weight:700;font-size:15px}
.otop-sub{font-size:11px;color:var(--pea-text-tertiary)}
.otop-back{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--pea-text-secondary);padding:8px 12px;border-radius:8px}
.otop-back:hover{background:var(--pea-bg-secondary-hover);color:var(--pea-text-primary)}

.ocontent{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
.obreadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pea-text-tertiary);margin-bottom:16px}
.obreadcrumb .is-current{color:var(--pea-text-brand-secondary);font-weight:600}
.opage-head{margin-bottom:22px}
.opage-head h1{font-size:26px;font-weight:700;margin-bottom:6px}
.opage-head p{font-size:14px;color:var(--pea-text-tertiary)}

.okpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
.okpi-card{padding:18px 20px;display:flex;align-items:center;gap:14px}
.okpi-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.okpi-icon--brand{background:var(--pea-bg-brand-primary);color:var(--pea-fg-brand-primary)}
.okpi-icon--success{background:var(--pea-utility-success-50);color:var(--pea-utility-success-700)}
.okpi-icon--error{background:var(--pea-utility-error-50);color:var(--pea-utility-error-700)}
.okpi-value{font-family:var(--pea-font-family-display);font-size:26px;font-weight:700;color:var(--pea-text-primary)}
.okpi-label{font-size:13px;color:var(--pea-text-tertiary)}

.ofeature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.ofeature-card{padding:22px 20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ofeature-icon{width:40px;height:40px;border-radius:10px;background:var(--pea-bg-brand-primary);color:var(--pea-fg-brand-primary);display:flex;align-items:center;justify-content:center}
.ofeature-title{font-size:16px;font-weight:700}
.ofeature-desc{font-size:13px;color:var(--pea-text-tertiary);line-height:1.5;flex:1}

.olist-card{padding:20px 22px}
.olist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.olist-head h3{font-size:16px;font-weight:700}
.olist-head-title{display:flex;flex-direction:column;gap:2px}
.olist-scope-note{font-size:12.5px;color:var(--pea-text-tertiary)}
.olist-head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.olist-empty{padding:32px 0;text-align:center;font-size:13.5px;color:var(--pea-text-tertiary)}
.oyear-filter{display:flex;gap:6px}
.oyear-btn{border:1px solid var(--pea-border-secondary);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--pea-text-secondary);cursor:pointer}
.oyear-btn.is-active{background:var(--pea-bg-brand-solid);border-color:var(--pea-bg-brand-solid);color:#fff}
.olist-rows{display:flex;flex-direction:column}
.olist-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--pea-border-tertiary)}
.olist-row:first-child{border-top:none}
.ba-tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--pea-bg-tertiary);color:var(--pea-text-secondary);white-space:nowrap}
.olist-row-sla{font-size:14px;font-weight:600;color:var(--pea-text-primary)}
.olist-row-dept{font-size:12.5px;color:var(--pea-text-tertiary);margin-top:2px}

@media (max-width:900px){.okpi-grid,.ofeature-grid{grid-template-columns:1fr}.olist-row{grid-template-columns:1fr;gap:8px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/pea-ds-react.bundle.js"></script>
<script src="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/_ds_bundle.js"></script>
<script type="module" src="/src/pages/sla-overview/entry.js"></script>
</body>
</html>
