<!DOCTYPE html>
<html lang="th" data-brand="pea" data-theme="light">
<head>
<meta charset="UTF-8">
<title>ข้อเสนอโอกาสในการปรับปรุงกระบวนการ (QIR) — PEA-SLA Tracking System</title>
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/primitive.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-light.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-dark.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/semantic-high-contrast.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/tokens.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/tokens/typography.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/pea-ds-react.bundle.css">
<link rel="stylesheet" href="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/styles.css">
<link rel="stylesheet" href="/icons.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--pea-bg-secondary);color:var(--pea-text-primary);font-family:var(--pea-font-family-body,"Google Sans",sans-serif);-webkit-font-smoothing:antialiased}
h1{font-family:var(--pea-font-family-display,"IBM Plex Sans Thai",sans-serif);margin:0}
a{color:var(--pea-text-brand-secondary);text-decoration:none}
button,input{font-family:inherit}
.icon{display:inline-block;flex-shrink:0}
.card{background:#fff;border:1px solid var(--pea-border-secondary);border-radius:12px}

.qtop{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 24px;background:#fff;border-bottom:1px solid var(--pea-border-secondary)}
.qtop-left{display:flex;align-items:center;gap:10px}
.qtop-logo{width:36px;height:36px;border-radius:8px;object-fit:contain}
.qtop-word{display:flex;flex-direction:column;line-height:1.2}
.qtop-title{font-family:var(--pea-font-family-display);font-weight:700;font-size:15px}
.qtop-sub{font-size:11px;color:var(--pea-text-tertiary)}
.qtop-back{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--pea-text-secondary);padding:8px 12px;border-radius:8px}
.qtop-back:hover{background:var(--pea-bg-secondary-hover)}

.qcontent{max-width:920px;margin:0 auto;padding:28px 24px 80px;display:flex;flex-direction:column;gap:16px}
.qbreadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--pea-text-tertiary);flex-wrap:wrap}
.qbreadcrumb .is-current{color:var(--pea-text-brand-secondary);font-weight:600}
.qpage-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qpage-head h1{font-size:24px;font-weight:700}
.qpage-head p{font-size:13.5px;color:var(--pea-text-tertiary);margin:4px 0 0}
.qexport-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--pea-border-secondary);background:#fff;border-radius:8px;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--pea-text-secondary);cursor:pointer}

.qform-card{padding:24px;display:flex;flex-direction:column;gap:22px}
.qfield{display:flex;flex-direction:column;gap:8px}
.qfield-label{font-size:14px;font-weight:700;color:var(--pea-text-primary)}
.qrequired{color:var(--pea-fg-error-primary)}
.qfield-hint{font-size:12.5px;color:var(--pea-text-tertiary);margin-top:-6px}
.qfield-static{padding:10px 14px;border:1px solid var(--pea-border-secondary);border-radius:8px;font-size:14px;background:var(--pea-bg-secondary)}

.qcriteria{display:flex;flex-direction:column;gap:10px}
.qcriteria-children{display:flex;flex-direction:column;gap:8px;padding-left:28px;margin-top:2px}
.qsuggestions{display:flex;flex-direction:column;gap:12px}
.qsuggestion-detail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;background:var(--pea-bg-secondary);border-radius:10px;padding:14px;margin-top:4px}

.qactivity{display:flex;flex-direction:column;gap:10px}
.qactivity-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.qactivity-title{font-size:14px;font-weight:700}
.qactivity-sub{font-size:12.5px;color:var(--pea-text-tertiary)}
.qactivity-warn{font-size:12.5px;color:var(--pea-fg-error-primary)}
.qtable{width:100%;border-collapse:collapse;font-size:13.5px}
.qtable th{text-align:left;font-size:12px;font-weight:700;color:var(--pea-text-tertiary);padding:10px 12px;border-bottom:1px solid var(--pea-border-tertiary)}
.qtable td{padding:10px 12px;border-bottom:1px solid var(--pea-border-tertiary);vertical-align:middle}
.qtext-input{width:100%;border:1px solid var(--pea-border-secondary);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none}
.qtext-input:focus{border-color:var(--pea-border-brand)}
.qweight-cell{width:110px}
.qweight-input{width:100%;border:1px solid var(--pea-border-secondary);border-radius:8px;padding:9px 12px;font-size:13.5px;outline:none;text-align:center}
.qrow-remove{border:none;background:none;color:var(--pea-text-tertiary);cursor:pointer;display:flex;padding:6px}
.qrow-remove:hover{color:var(--pea-fg-error-primary)}
.qactivity-add{display:flex;justify-content:center;padding:6px 0}
.qactivity-total{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding-top:8px;border-top:1px solid var(--pea-border-tertiary);font-size:13.5px;color:var(--pea-text-secondary)}
.qactivity-total-num{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.qactivity-total-num span:first-child{font-family:var(--pea-font-family-display);font-size:18px;font-weight:700;color:var(--pea-text-primary)}
.qactivity-total-num span.is-ok{color:var(--pea-fg-success-primary)}
.qactivity-total-num span.is-error{color:var(--pea-fg-error-primary)}
.qactivity-total-note{font-size:11.5px;color:var(--pea-text-tertiary)}
.qform-footer{display:flex;justify-content:flex-start;gap:10px}

@media (max-width:640px){.qsuggestion-detail{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/pea-ds-react.bundle.js"></script>
<script src="/_ds/pea-design-system-newest-cbd18118-ffd4-4a23-9eb9-992de10a0e85/_ds_bundle.js"></script>
<script type="module" src="/src/pages/qir-annual-form/entry.js"></script>
</body>
</html>
